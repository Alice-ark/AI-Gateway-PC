<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Gateway PC · 管理台</title>
<style>
:root{
  --bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--border:#2a2f42;
  --text:#e8eaf2;--dim:#9aa0b5;--accent:#6c8cff;--ok:#3ecf8e;--warn:#f5a623;--bad:#ff5c5c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;display:flex;min-height:100vh}
nav{width:200px;background:var(--panel);border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0}
nav h1{font-size:16px;padding:6px 10px 18px}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.active{background:var(--panel2);color:var(--accent);font-weight:600}
main{flex:1;padding:22px 26px;max-width:1100px}
h2{font-size:18px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.stat b{display:block;font-size:22px;margin-top:4px}
.stat span{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);text-align:left;font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}
.b-ok{background:rgba(62,207,142,.15);color:var(--ok)}
.b-off{background:rgba(245,166,35,.15);color:var(--warn)}
.b-bad{background:rgba(255,92,92,.15);color:var(--bad)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
input,select,textarea{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;width:100%}
label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.muted{color:var(--dim);font-size:12px}
.status-line{margin-top:10px;padding:10px;border-radius:8px;display:none}
.status-line.show{display:block}
.s-ok{background:rgba(62,207,142,.12);color:var(--ok)}
.s-bad{background:rgba(255,92,92,.12);color:var(--bad)}
.s-wait{background:rgba(108,140,255,.12);color:var(--accent)}
.switch{position:relative;width:38px;height:20px;background:var(--panel2);border-radius:12px;cursor:pointer;display:inline-block;vertical-align:middle}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.2s}
.switch.on{background:var(--accent)}.switch.on::after{left:20px;background:#fff}
#loginUrl a{color:var(--accent);word-break:break-all}
</style>
</head>
<body>
<nav>
  <h1>AI Gateway PC</h1>
  <button data-tab="overview" class="active">📊 总览</button>
  <button data-tab="accounts">👤 账号</button>
  <button data-tab="login">➕ 添加账号</button>
  <button data-tab="models">🧠 模型</button>
  <button data-tab="usage">📈 用量</button>
  <button data-tab="settings">⚙️ 设置</button>
  <p class="muted" style="padding:14px 10px" id="gatewayUrl"></p>
</nav>
<main>

<section id="tab-overview">
  <h2>总览</h2>
  <div class="cards" id="ovCards"></div>
  <div class="card"><h2 style="font-size:15px">供应商</h2><table id="ovProviders"></table></div>
</section>

<section id="tab-accounts" style="display:none">
  <h2>账号 <button class="btn" onclick="loadAccounts()">刷新</button></h2>
  <div class="card"><table id="accTable"></table></div>
</section>

<section id="tab-login" style="display:none">
  <h2>添加账号</h2>
  <div class="card">
    <label>选择供应商</label>
    <select id="loginProvider" onchange="loginProviderChanged()"></select>
    <div id="loginPanel" style="margin-top:14px"></div>
    <div id="loginStatus" class="status-line"></div>
  </div>
  <p class="muted">提示：手机 App「账号导入导出」导出的信封 JSON，也可用命令行 <code>aigw transfer import</code> 一次性导入。</p>
</section>

<section id="tab-models" style="display:none">
  <h2>模型 <button class="btn" onclick="loadModels()">刷新</button></h2>
  <div class="card"><table id="modelTable"></table></div>
</section>

<section id="tab-usage" style="display:none">
  <h2>用量</h2>
  <div class="cards" id="usageCards"></div>
  <div class="card"><h2 style="font-size:15px">最近调用</h2><table id="usageTable"></table></div>
</section>

<section id="tab-settings" style="display:none">
  <h2>设置</h2>
  <div class="card">
    <label>网关端口（改动需重启 aigw serve）</label><input id="setPort" type="number">
    <label>API Key（留空 = 不校验；显示为掩码时表示已设置）</label><input id="setKey" placeholder="留空保持不变">
    <div style="margin-top:14px">允许无 Key 调用 <span id="swNoKey" class="switch" onclick="this.classList.toggle('on')"></span></div>
    <div style="margin-top:8px">暴露到局域网 <span id="swLan" class="switch" onclick="this.classList.toggle('on')"></span>
      <span class="muted">（默认关闭：开启后同一局域网的设备均可访问网关）</span></div>
    <p><button class="btn primary" style="margin-top:16px" onclick="saveSettings()">保存设置</button></p>
    <div id="setStatus" class="status-line"></div>
  </div>
</section>

</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, opts){ const r = await fetch(path, opts); return r.json(); }
const post = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});

// 选项卡
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('main section').forEach(x => x.style.display='none');
  b.classList.add('active');
  $('#tab-'+b.dataset.tab).style.display='block';
  ({overview:loadOverview, accounts:loadAccounts, models:loadModels, usage:loadUsage, settings:loadSettings}[b.dataset.tab]||(()=>{}))();
});

function fmtTime(ms){ return ms? new Date(ms).toLocaleString('zh-CN',{hour12:false}) : '-'; }
function shortUid(u){ return u.length>12 ? u.slice(0,8)+'…' : u; }

async function loadOverview(){
  const d = await api('/api/overview');
  $('#gatewayUrl').innerHTML = '网关 http://127.0.0.1:'+d.port+'/v1<br>本管理台 http://127.0.0.1:'+location.port;
  const u = d.usage, okRate = u.requests? Math.round(u.success*100/u.requests):100;
  $('#ovCards').innerHTML = [
    ['账号（可用/总）', d.accounts.filter(a=>a.healthy!==false).length+'/'+d.accounts.length],
    ['可用模型', d.modelsCount], ['供应商', d.providers.length],
    ['请求总数', u.requests], ['成功率', okRate+'%'], ['Tokens', u.totalTokens.toLocaleString()],
  ].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  $('#ovProviders').innerHTML = '<tr><th>供应商</th><th>账号</th><th>可用</th><th>登录方式</th><th>能力</th></tr>' +
    d.providers.map(p=>`<tr><td>${esc(p.displayName)} <span class="muted">${p.id}</span></td><td>${p.accountCount}</td><td>${p.usableCount}</td><td>${esc(p.authKind)}</td><td class="muted">${esc([...p.capabilities].join(', '))}</td></tr>`).join('');
}
async function loadAccounts(){
  const d = await api('/api/accounts');
  $('#accTable').innerHTML = '<tr><th>供应商</th><th>昵称</th><th>uid</th><th>额度</th><th>状态</th><th>操作</th></tr>' +
    d.accounts.map(a=>{
      const healthy = !a.disabled && a.enabled;
      const badge = a.disabled? '<span class="badge b-bad">凭证失效</span>' : (a.enabled? '<span class="badge b-ok">正常</span>' : '<span class="badge b-off">已停用</span>');
      const credit = a.creditsKnown? a.credits+(a.creditUnit?' '+a.creditUnit:'') : (a.detail||'未知');
      return `<tr><td>${esc(a.providerId)}</td><td>${esc(a.nickname||'-')}</td><td class="muted">${shortUid(a.uid)}</td><td>${esc(credit)}</td><td>${badge}${a.reason?'<br><span class="muted">'+esc(a.reason)+'</span>':''}</td>
      <td><button class="btn" onclick="refreshCredit('${a.providerId}','${a.uid}')">刷额度</button>
      <button class="btn" onclick="toggleAcc('${a.providerId}','${a.uid}',${!a.enabled})">${a.enabled?'停用':'启用'}</button>
      <button class="btn danger" onclick="removeAcc('${a.providerId}','${a.uid}')">删除</button></td></tr>`;
    }).join('') || '<tr><td colspan="6" class="muted">还没有账号，去「添加账号」登录一个</td></tr>';
}
async function refreshCredit(p,u){ const r = await post('/api/credits',{providerId:p,uid:u}); alert(r.message|| (r.ok?'已刷新':'失败')); loadAccounts(); }
async function toggleAcc(p,u,en){ await post('/api/accounts/enabled',{providerId:p,uid:u,enabled:en}); loadAccounts(); }
async function removeAcc(p,u){ if(confirm('确定删除账号 '+p+'/'+shortUid(u)+' ?')){ await post('/api/accounts/remove',{providerId:p,uid:u}); loadAccounts(); } }

let loginProviders = [];
async function initLoginSelect(){
  if(loginProviders.length) return;
  const d = await api('/api/providers');
  loginProviders = d.providers;
  $('#loginProvider').innerHTML = d.providers.map(p=>`<option value="${p.id}">${p.displayName}（${p.authKind}）</option>`).join('');
  loginProviderChanged();
}
function loginProviderChanged(){ $('#loginPanel').innerHTML=''; $('#loginStatus').className='status-line'; }
let pollTimer=null;
async function startLogin(){
  clearInterval(pollTimer);
  const p = $('#loginProvider').value;
  const d = await post('/api/login/start',{providerId:p});
  const st = $('#loginStatus');
  const show = (cls,text)=>{ st.className='status-line show '+cls; st.innerHTML=text; };
  if(d.mode==='sms'){ show('s-wait','短信登录：请填手机号和验证码（下方表单）'); smsPanel(p); return; }
  show('s-wait','请在新标签页完成登录：<div id="loginUrl"><a href="'+esc(d.loginUrl)+'" target="_blank">'+esc(d.loginUrl)+'</a></div>（点击上方链接打开登录页）');
  window.open(d.loginUrl,'_blank');
  if(d.mode==='poll'){
    pollTimer = setInterval(async ()=>{
      const r = await api('/api/login/poll?provider='+p+'&state='+encodeURIComponent(d.pollState)+'&region='+encodeURIComponent(d.region||''));
      if(r.status==='success'){ clearInterval(pollTimer); show('s-ok','✅ 登录成功：'+esc(r.nickname||r.uid)); loadOverview(); }
      else if(r.status==='failed'){ clearInterval(pollTimer); show('s-bad','❌ 失败：'+esc(r.error)); }
    },3000);
  } else {
    pollTimer = setInterval(async ()=>{
      const r = await api('/api/login/wait?provider='+p);
      if(r.status==='success'){ clearInterval(pollTimer); show('s-ok','✅ 登录成功，账号已加入账号池'); loadOverview(); }
      else if(r.status==='timeout'){ clearInterval(pollTimer); show('s-bad','⏱ 等待超时（5 分钟），请重试'); }
    },2000);
  }
}
function pastePanel(p){
  return `<div style="margin-top:12px"><label>兜底：若浏览器提示无法打开本地回调（如自定义协议），把跳转后地址栏的完整链接粘贴到这里</label>
  <textarea id="pasteUrl" rows="2"></textarea>
  <p><button class="btn" onclick="doPaste('${p}')">提交回调链接</button></p></div>`;
}
async function doPaste(p){
  const url = $('#pasteUrl').value.trim();
  if(!url) return;
  const r = await post('/api/login/paste',{providerId:p,url});
  const st=$('#loginStatus'); st.className='status-line show '+(r.status==='success'?'s-ok':'s-bad');
  st.textContent = r.status==='success'? '✅ 导入成功：'+(r.nickname||r.uid) : '❌ '+(r.error||'失败');
  if(r.status==='success'){ clearInterval(pollTimer); loadOverview(); }
}
function smsPanel(p){
  $('#loginPanel').innerHTML = `
  <div class="row"><div><label>手机号</label><input id="smsPhone" placeholder="13xxxxxxxxx"></div>
  <div style="flex:0 0 auto"><button class="btn primary" onclick="smsSend('${p}')">发送验证码</button></div></div>
  <div id="smsStep2" style="display:none"><div class="row">
  <div><label>msgid</label><input id="smsMsgid" readonly></div>
  <div><label>验证码</label><input id="smsCode"></div>
  <div style="flex:0 0 auto"><button class="btn primary" onclick="smsDone('${p}')">完成登录</button></div></div></div>`;
}
async function smsSend(p){
  const phone = $('#smsPhone').value.trim(); if(!phone) return;
  const r = await post('/api/sms/send',{providerId:p,phone});
  $('#smsMsgid').value = r.msgid||''; $('#smsStep2').style.display='block';
  const st=$('#loginStatus'); st.className='status-line show s-wait'; st.textContent='验证码已发送，请查收短信';
}
async function smsDone(p){
  const r = await post('/api/sms/complete',{providerId:p,phone:$('#smsPhone').value.trim(),code:$('#smsCode').value.trim(),msgid:$('#smsMsgid').value});
  const st=$('#loginStatus'); st.className='status-line show '+(r.status==='success'?'s-ok':'s-bad');
  st.textContent = r.status==='success'? '✅ 登录成功：'+(r.nickname||r.uid) : '❌ '+(r.error||'失败');
  if(r.status==='success') loadOverview();
}
async function loadModels(){
  const d = await api('/api/models');
  $('#modelTable').innerHTML = '<tr><th>调用 ID</th><th>名称</th><th>供应商</th><th>上下文</th></tr>' +
    d.models.map(m=>`<tr><td><code>${esc(m.fullId)}</code></td><td>${esc(m.name)}</td><td>${esc(m.providerName)}</td><td class="muted">${m.contextWindow? m.contextWindow.toLocaleString():'-'}</td></tr>`).join('');
}
async function loadUsage(){
  const d = await api('/api/usage');
  const t = d.totals;
  $('#usageCards').innerHTML = [
    ['请求',t.requests],['成功',t.success],['失败',t.failed],['中断',t.aborted],
    ['输入 tokens',t.promptTokens.toLocaleString()],['输出 tokens',t.completionTokens.toLocaleString()],
    ['缓存命中',t.cachedTokens.toLocaleString()],['费用','$'+(t.costMicros/1e6).toFixed(4)],
  ].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  $('#usageTable').innerHTML = '<tr><th>时间</th><th>供应商</th><th>模型</th><th>状态</th><th>tokens</th><th>耗时</th></tr>' +
    d.recent.map(r=>`<tr><td class="muted">${fmtTime(r.startedAtMillis)}</td><td>${esc(r.providerId)}</td><td>${esc(r.model)}</td><td>${esc(r.status)}</td><td>${r.totalTokens}</td><td>${r.durationMillis||0}ms</td></tr>`).join('');
}
async function loadSettings(){
  const d = await api('/api/settings');
  $('#setPort').value = d.port; $('#setKey').value = d.apiKey;
  $('#swNoKey').classList.toggle('on', d.allowNoKey); $('#swLan').classList.toggle('on', d.exposeLan);
}
async function saveSettings(){
  const body = { port: parseInt($('#setPort').value)||undefined,
    apiKey: $('#setKey').value.includes('•')? undefined : $('#setKey').value,
    allowNoKey: $('#swNoKey').classList.contains('on'), exposeLan: $('#swLan').classList.contains('on') };
  const r = await post('/api/settings', body);
  const st=$('#setStatus'); st.className='status-line show '+(r.ok?'s-ok':'s-bad');
  st.textContent = (r.ok?'✅ 已保存。':'❌ 失败')+(r.note?' '+r.note:'');
}
// 登录页初始化：切到登录 tab 时加载供应商下拉
const origClick = document.querySelector('nav button[data-tab="login"]').onclick;
document.querySelector('nav button[data-tab="login"]').addEventListener('click', initLoginSelect);
window.addEventListener('DOMContentLoaded', () => { loadOverview(); setInterval(()=>{ if($('#tab-overview').style.display!=='none') loadOverview(); },10000); });
</script>
</body>
</html>
